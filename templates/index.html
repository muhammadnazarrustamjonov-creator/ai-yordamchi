<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Chap yon panel (Sidebar) -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-robot"></i></div>
                <span class="logo-text">Steve AI</span>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class="fa-regular fa-message"></i> Yangi chat
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-regular fa-folder"></i> Kutubxona
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gear"></i> Sozlamalar
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <!-- Anonim toza ko'rinish -->
                </div>
            </div>
        </aside>

        <!-- Asosiy ishchi qism -->
        <main class="main-content">
            <div class="chat-wrapper">
                <h1 class="welcome-title">Qani, boshlaymiz!</h1>

                <!-- So'rov paneli -->
                <div class="search-box">
                    <input type="text" placeholder="Steve AI dan nima haqida so'ramoqchisiz?">
                    <div class="search-actions-left">
                        <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                        <button class="action-btn"><i class="fa-solid fa-paperclip"></i></button>
                    </div>
                    <div class="search-actions-right">
                        <button class="action-btn"><i class="fa-solid fa-microphone"></i></button>
                        <button class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
                    </div>
                </div>

                <!-- Kartochkalar -->
                <div class="cards-grid">
                    <div class="feature-card">
                        <h3>Yangi kod yozish</h3>
                        <p>Dasturlash va skriptlar yaratishda yordam olish</p>
                    </div>
                    <div class="feature-card">
                        <h3>Ma'lumotni tahlil qilish</h3>
                        <p>Matn va fayllarni tahlil qilish hamda xulosalash</p>
                    </div>
                    <div class="feature-card">
                        <h3>Rasm yaratish</h3>
                        <p>Matnli tavsiflar asosida noyob vizual g'oyalar yaratish</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
